name: "Rebase"

on:
  workflow_call:
    inputs:
      revision:
        description: Git revision or channel URL to rebase the target branch on; defaults to https://channels.nixos.org/nixpkgs-unstable/git-revision
        required: false
        type: string
      upstream:
        description: Upstream nixpkgs repository.
        required: true
        type: string
      target:
        description: Target branch to rebase onto.
        required: true
        type: string

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  rebase:
    permissions:
      contents: write
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: Get GitHub Actions User ID
        id: get-user-id
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "user-id=$(gh api "/users/github-actions[bot]" --jq .id)" >> "$GITHUB_OUTPUT"

      - name: Set Git Committer ID
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "${USER_ID}+github-actions[bot]@users.noreply.github.com"
          gh auth setup-git
        env:
          GH_TOKEN: ${{ github.token }}
          USER_ID: ${{ steps.get-user-id.outputs.user-id }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target }}
          fetch-depth: 0
          filter: blob:none
          # Make sure the value of GITHUB_TOKEN will not be persisted in repo's config
          persist-credentials: false

      - name: Rebase onto upstream nixpkgs
        env:
          GH_TOKEN: ${{ github.token }}
          INPUTS_REVISION: ${{ inputs.revision }}
          INPUTS_TARGET: ${{ inputs.target }}
          INPUTS_UPSTREAM_URL: ${{ inputs.upstream }}
          CHANNEL_REVISION_URL: https://channels.nixos.org/nixpkgs-unstable/git-revision
        run: |
          set -ue
          set -o pipefail

          TARGET_REVISION="${INPUTS_REVISION:-}"

          INPUTS_REVISION="${INPUTS_REVISION:-"${CHANNEL_REVISION_URL}"}"

          if [[ "${INPUTS_REVISION}" =~ ^https?:// ]]; then
            printf 'Getting channel revision from "%s"\n' "${INPUTS_REVISION}"
            TARGET_REVISION="$(curl -sSfL "${INPUTS_REVISION}" | tr -d '[:space:]')"
          fi

          if [[ ! "${TARGET_REVISION}" =~ ^[0-9a-f]{40}$ ]]; then
            printf '::error::Channel revision is not a valid commit SHA: "%s"\n' "${TARGET_REVISION}"
            exit 1
          fi

          printf 'Configuring upstream remote "%s"\n' "${INPUTS_UPSTREAM_URL}"
          if git remote get-url upstream &>/dev/null; then
            git remote set-url upstream "${INPUTS_UPSTREAM_URL}"
          else
            git remote add upstream "${INPUTS_UPSTREAM_URL}"
          fi

          # The upstream remote is cloned without large blobs and configured to
          # be trusted to stream the missing objects.
          git config remote.upstream.promisor true
          git config remote.upstream.partialclonefilter blob:none

          printf 'Fetching revision "%s" from upstream\n' "${TARGET_REVISION}"
          git fetch --no-tags --filter=blob:none upstream "${TARGET_REVISION}"

          if git merge-base --is-ancestor "${TARGET_REVISION}" HEAD; then
            printf 'The branch "%s" already contains "%s" in its history. Not rebasing\n' "${INPUTS_TARGET}" "${TARGET_REVISION}"
            exit 0
          fi

          printf 'Rebasing branch "%s" onto revision "%s"\n' "${INPUTS_TARGET}" "${TARGET_REVISION}"
          if ! git rebase "${TARGET_REVISION}"; then
            printf '::error::Rebase onto "%s" failed\n' "${TARGET_REVISION}"
            git rebase --abort || true
            exit 1
          fi

          printf 'Pushing "%s"\n' "${INPUTS_TARGET}"
          git push --force-with-lease origin "${INPUTS_TARGET}"

# This action periodically rebases branches onto upstream nixpkgs.

name: "Periodic Rebases (24h)"

on:
  schedule:
    # * is a special character in YAML so you have to quote this string
    # Rebase every 24 hours
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  collect-branches:
    if: github.repository_owner == 'janvhs' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    uses: $/.github/workflows/periodic-rebase-collect-branches.yml
    with:
      exclude: |
        fix-gnome-initial-setup
      upstream: https://github.com/NixOS/nixpkgs.git

  periodic-rebase:
    needs: collect-branches
    if: needs.collect-branches.outputs.targets != '[]'
    strategy:
      # don't fail fast, so that all targets are tried
      fail-fast: false
      max-parallel: 1
      matrix:
        targets: ${{ fromJSON(needs.collect-branches.outputs.targets) }}
    uses: $/.github/workflows/periodic-rebase.yml
    with:
      target: ${{ matrix.targets.target }}
      upstream: ${{ matrix.targets.upstream }}
      revision: ${{ matrix.targets.revision }}
    name: ${{ format('{0} → {1}', matrix.targets.target, matrix.targets.short_revision) }}
    secrets:
      CI_APP_PRIVATE_KEY: ${{ secrets.CI_APP_PRIVATE_KEY }}
